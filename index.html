<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c0c0e"><meta name="description" content="Cardápio do Boi Espetos Bar. Confira espetos, espetos crus sob encomenda, caipirinhas, drinks e doces."><title>Cardápio | Boi Espetos Bar</title><link rel="icon" href="boi-logo.png" type="image/png">
<style>

or:var(--red)}main{padding:10px 0 44px}.menu-section{margin:28px 0 0}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 13px}.section-heading h2{font-size:21px;letter-spacing:-.5px;margin:0;line-height:1.3}.section-heading h2:before{content:"";display:inline-block;background:var(--red);width:3px;height:17px;vertical-align:-1px;margin-right:10px;border-radius:3px}.section-note{color:var(--muted);font-size:11px;line-height:1.5;margin:0;max-width:220px;text-align:right}.rows{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.item{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:19px 21px}.item+.item{border-top:1px solid #f0ebe7}.item-name{font-size:14px;line-height:1.45;font-weight:600;margin:0}.item-description{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.5}.price{flex-shrink:0;text-align:right;color:var(--red);font-size:14px;line-height:1.45;font-weight:700;white-space:nowrap}.price.pending{color:var(--muted);font-size:11px;font-weight:400;white-space:normal;max-width:85px}.price.options{font-size:12px;max-width:145px;white-space:normal}.result-label{font-size:13px;color:var(--muted);margin:23px 0 4px;line-height:1.5;overflow-wrap:anywhere}.empty{text-align:center;padding:55px 10px;color:var(--muted);line-height:1.6}.empty strong{color:var(--ink);display:block;margin-bottom:6px;font-size:17px}.empty button{margin-top:18px;background:var(--red);color:white;border:0;border-radius:6px;padding:12px 20px;font-size:13px}.review-note{margin:30px 0 0;padding:13px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;line-height:1.7;background:#fff8}.review-note strong{color:var(--ink);font-weight:600}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:11px}footer .wrap{display:flex;justify-content:space-between;gap:20px;align-items:center}footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--red)}[hidden]{display:none!important}@media(min-width:1050px){.wrap{width:780px}.masthead{padding-top:35px}.item{padding:18px 22px}.logo{width:148px}}@media(max-width:560px){.wrap{width:calc(100% - 28px)}.masthead{padding:24px 0 15px}.logo{width:112px;margin-bottom:14px}.masthead h1{font-size:24px}.masthead p{font-size:12px}.controls{padding-top:12px}.search input{padding-top:13px;padding-bottom:13px}.search svg{top:14px}.clear-search{top:6px}.categories{gap:6px;padding-bottom:12px}.category{padding:9px 13px;font-size:11px}.section-heading h2{font-size:19px}.section-note{font-size:10px;max-width:145px}.item{gap:16px;padding:17px 15px}.item-name{font-size:13px}.price{font-size:13px}.price.options{font-size:11px;max-width:100px}.price.pending{font-size:10px;max-width:70px}.menu-section{margin-top:26px}.review-note{font-size:10px;padding:12px 14px}footer{font-size:10px}main{padding-bottom:30px}.result-label{font-size:12px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Tema preto e vermelho */
:root{color-scheme:dark;--red:#ff4d56;--ink:#f7f5f4;--muted:#aaa5a6;--bg:#0c0c0e;--line:#2b282c;--card:#181719;--soft:#2a1519}
body{background:radial-gradient(ellipse 800px 380px at 50% -100px,#6e10182b,transparent 80%),var(--bg)}
body:before{content:"";display:block;height:3px;background:linear-gradient(90deg,#711820,#ec2938 50%,#711820)}
.masthead{display:flex;align-items:center;gap:48px;text-align:left;padding:44px 0 34px;position:relative}
.logo{width:170px;margin:0;flex-shrink:0;filter:drop-shadow(0 8px 20px #bd15251a)}
.brand-label{display:block;font-size:10px;letter-spacing:3px;font-weight:700;text-transform:uppercase;color:var(--red);margin:0 0 12px}
.masthead h1{font-family:Arial,Helvetica,sans-serif;font-size:43px;font-weight:800;letter-spacing:-1.3px;text-transform:uppercase;line-height:1.05;margin-bottom:12px}
.masthead p{font-size:13px;color:var(--muted);letter-spacing:.2px}
.controls{background:#0c0c0ef5;backdrop-filter:blur(14px);border-bottom-color:#302226;padding-top:15px}
.search{margin-bottom:15px}.search input{background:#171618;border-color:#353034;border-radius:10px;box-shadow:0 6px 24px #0002;color:var(--ink)}
.search input::placeholder{color:#8f898d}.search input:focus{border-color:#ae3740;box-shadow:0 0 0 3px #d7212d13;outline:0}
.search svg{color:#a69da1}.clear-search:hover{background:#292326}
.categories{gap:8px;padding-bottom:16px}.category{background:#171618;border-color:#353034;color:#bdb6ba;border-radius:8px;transition:background .18s,border-color .18s,color .18s;padding:11px 17px}
.category[aria-pressed=true]{background:#dc2835;color:white;border-color:#f14650;box-shadow:0 3px 14px #df28351c}
.category:hover{background:#24191d;border-color:#92353f;color:#fff}
.category[aria-pressed=true]:hover{background:#ed3442}
main{padding-top:7px}.menu-section{margin-top:34px}.section-heading{margin-bottom:16px}.section-heading h2{font-size:22px;font-weight:800;letter-spacing:-.35px}.section-heading h2:before{height:19px;width:4px;margin-right:12px;vertical-align:-2px;background:#eb3442}
.section-note{font-size:11px;color:#d6a4a7;background:#28171b;border:1px solid #4b252c;border-radius:5px;padding:6px 9px}
.rows{border-color:#332a2e;border-radius:12px;background:linear-gradient(120deg,#1c191c,#151416);box-shadow:0 12px 32px #0002}
.item{min-height:68px;padding:19px 22px;transition:background .18s}.item:hover{background:#271c2180}.item+.item{border-color:#30272d}
.item-name{font-size:15px;font-weight:650;letter-spacing:.05px}.item-description{color:#aaa1a5}
.price{color:#ff7c83;background:#361b21;border:1px solid #58272f;padding:6px 9px;border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.1px}
.price.options{font-size:12px}.price.pending{background:transparent;border-color:transparent;color:#a49b9f;font-size:11px;padding:5px 0}
.review-note{background:#161416;border-color:#312a2e;color:#a9a0a4;border-left:2px solid #a4343e;border-radius:7px;line-height:1.8}
footer{border-top-color:#2d252a;background:#0b0a0c;color:#9a9096;padding:26px 0}footer span{font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-size:10px}footer a{color:#aaa0a6}
.empty button{background:#dc2835}.result-label{color:#b2a8ae}
@media(min-width:1050px){.masthead{padding-top:46px}.logo{width:176px}.item{padding:19px 22px}}
@media(max-width:560px){.masthead{flex-direction:column;gap:19px;text-align:center;padding:28px 0 23px}.logo{width:133px;margin:0}.brand-label{font-size:9px;letter-spacing:2.6px;margin-bottom:10px}.masthead h1{font-size:clamp(29px,8vw,35px);letter-spacing:-.9px;margin-bottom:10px}.masthead p{font-size:12px}.controls{padding-top:12px}.categories{gap:7px;padding-bottom:13px}.category{padding:10px 14px;font-size:11px}.menu-section{margin-top:29px}.section-heading{gap:10px;margin-bottom:13px}.section-heading h2{font-size:20px}.section-heading h2:before{margin-right:9px;height:17px}.section-note{font-size:9px;padding:5px 7px;max-width:145px}.item{min-height:65px;padding:17px 15px;gap:14px}.item-name{font-size:14px}.price{font-size:12px;padding:5px 7px}.price.options{font-size:10px;max-width:95px}.price.pending{font-size:10px;max-width:70px;padding:4px 0}.review-note{font-size:10px}footer .wrap{gap:10px}footer span{font-size:9px;letter-spacing:.9px}}
</style>
</head>
<body>
<header class="masthead wrap" id="inicio"><img class="logo" src="boi-logo.png" alt="Boi Espetos Bar" width="1600" height="1000"><div class="masthead-copy"><span class="brand-label">Boi Espetos Bar</span><h1>Nosso cardápio</h1><p>Espetos, drinks e bons momentos.</p></div></header>
<div class="controls"><div class="wrap"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Buscar no cardápio" aria-label="Buscar itens no cardápio" autocomplete="off"><button class="clear-search" aria-label="Limpar busca" type="button" hidden>×</button></div><nav class="categories" aria-label="Categorias do cardápio"></nav></div></div>
<main class="wrap" id="cardapio"><p class="result-label" role="status" aria-live="polite" hidden></p><div id="sections"></div><div class="empty" hidden><strong>Nenhum item encontrado</strong>Tente outro nome ou escolha uma categoria.<br><button type="button" id="reset">Ver todo o cardápio</button></div><p class="review-note"><strong>Cardápio em conferência.</strong> Esta versão contém os itens legíveis nas fotos. Alguns nomes e valores ainda aguardam confirmação.</p></main>
<footer><div class="wrap"><span>Boi Espetos Bar</span><a href="#inicio">Voltar ao início ↑</a></div></footer>
<script>
let data={categories:[],items:[]};let selected='all';const search=document.querySelector('#search');const sections=document.querySelector('#sections');const nav=document.querySelector('.categories');const clear=document.querySelector('.clear-search');const resultLabel=document.querySelector('.result-label');
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const currency=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function make(tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e}
function render(){const term=normalize(search.value);clear.hidden=!search.value;const matches=data.items.filter(item=>(selected==='all'||item.category===selected)&&normalize(item.name+' '+(item.description||'')+' '+data.categories.find(c=>c.id===item.category).name).includes(term));sections.replaceChildren();for(const category of data.categories){const entries=matches.filter(i=>i.category===category.id);if(!entries.length)continue;const section=make('section','menu-section');section.id='sec-'+category.id;section.setAttribute('aria-labelledby','heading-'+category.id);const heading=make('div','section-heading');const title=make('h2','',category.name);title.id='heading-'+category.id;heading.append(title);if(category.note)heading.append(make('p','section-note',category.note));section.append(heading);const rows=make('div','rows');entries.forEach(item=>{const row=make('article','item');const info=make('div','item-info');info.append(make('h3','item-name',item.name));if(item.description)info.append(make('p','item-description',item.description));row.append(info);let price=item.priceLabel||(item.price!==null?currency.format(item.price):'Valor a confirmar');const p=make('span','price'+(item.priceLabel?' options':item.price===null?' pending':''),price);row.append(p);rows.append(row)});section.append(rows);sections.append(section)}resultLabel.hidden=!term;resultLabel.textContent=term?(matches.length===1?'1 item encontrado':matches.length+' itens encontrados'):'';document.querySelector('.empty').hidden=matches.length>0;[...nav.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===selected)))}
function reset(){selected='all';search.value='';render()}
function changeCategory(id){selected=id;render();document.querySelector('.controls').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
search.addEventListener('input',render);clear.addEventListener('click',()=>{search.value='';render();search.focus()});document.querySelector('#reset').addEventListener('click',reset);
fetch('menu-data.json').then(r=>{if(!r.ok)throw new Error('menu');return r.json()}).then(d=>{data=d;[{id:'all',name:'Todos'},...data.categories].forEach(category=>{const b=make('button','category',category.name);b.type='button';b.dataset.category=category.id;b.setAttribute('aria-pressed',String(category.id==='all'));b.addEventListener('click',()=>changeCategory(category.id));nav.append(b)});render()}).catch(()=>{sections.textContent='Não foi possível carregar o cardápio. Atualize a página para tentar novamente.'});
</script>
</body>
</html>
